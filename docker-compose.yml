# Production stack. Run from the repo root:
#   docker compose --env-file .env.production up -d --build
# See DEPLOY.md.

x-build-args: &build-args
  VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env.production}
  VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?set VITE_SUPABASE_ANON_KEY in .env.production}
  VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
      args: *build-args
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY_HOPS: "1"
    # Not published: only Caddy reaches it, on the internal network.
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
      args: *build-args
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
      SUPABASE_URL: ${VITE_SUPABASE_URL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
